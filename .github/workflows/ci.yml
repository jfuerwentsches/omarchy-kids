name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    name: agent (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - run: cargo build --workspace --all-targets
        working-directory: agent

      # Clippy is clean today (verified 2026-08-30) — kept as a hard gate so
      # it stays that way. cargo fmt is deliberately NOT gated here: the
      # existing code predates a repo-wide fmt pass, and reformatting it is
      # a separate, unrelated cleanup, not part of standing up CI.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: agent

      - run: cargo test --workspace
        working-directory: agent

  agent-audit:
    name: agent (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: cargo-audit

      # Issue #39: check the dependency tree against the RustSec advisory
      # database on every push/PR — a separate job (not folded into `agent`
      # above) so a newly published advisory failing this doesn't block on
      # or get confused with a build/lint/test failure.
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: agent

  control:
    name: control (CMake/Qt6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build qt6-base-dev libtomlplusplus-dev libgtest-dev

      - run: cmake -S control -B control/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build control/build
      - run: ctest --test-dir control/build --output-on-failure

  lint-shell:
    name: shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      # Verified clean end to end (2026-08-30). The bootstrap lib/*.sh files
      # are sourced, not executed, so they need --shell=bash (shellcheck
      # can't infer a shell from a file with no shebang) and -x from inside
      # setup-wizard/bootstrap so the relative `source` paths resolve.
      - run: |
          shellcheck --shell=bash \
            scripts/vm-type-de.sh \
            scripts/vm-type-us.sh \
            scripts/vm-snapshot.sh \
            scripts/vm-pairing-smoke-test.sh \
            scripts/vm-recreate.sh \
            scripts/vm-deploy-agent.sh \
            scripts/vm-pair-for-dashboard.sh \
            scripts/vm-apply-tier.sh \
            scripts/vm-cidata-build.sh \
            tiers/omarchy-kids-set-tier \
            setup-wizard/first-boot/omarchy-kids-setup-wizard
          cd setup-wizard/bootstrap
          shellcheck --shell=bash -x omarchy-kids-bootstrap lib/*.sh

  lint-lua:
    name: Hyprland Lua configs (luac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - run: find tiers -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

  packaging:
    name: packaging (Arch PKGBUILDs)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: pacman -Sy --noconfirm --needed git namcap sudo

      - name: Prepare build user
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          printf 'builder ALL=(ALL:ALL) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/ci-builder-pacman
          chmod 0440 /etc/sudoers.d/ci-builder-pacman

      - name: Install package dependencies
        shell: bash
        run: |
          set -euo pipefail

          install_pkgs=()
          for pkgbuild in \
            agent/packaging/PKGBUILD \
            tiers/packaging/PKGBUILD \
            control/packaging/PKGBUILD \
            setup-wizard/packaging/PKGBUILD \
            quickshell-plugin/packaging/PKGBUILD
          do
            # shellcheck disable=SC1090
            source "$pkgbuild"
            for dep in "${depends[@]-}" "${makedepends[@]-}" "${checkdepends[@]-}"; do
              dep="${dep%%:*}"
              dep="${dep%%|*}"
              dep="${dep%%[<>=]*}"
              case "$dep" in
                cargo) dep=rust ;;
                omarchy-kids-*) continue ;;
              esac
              if [[ -n "$dep" ]]; then
                install_pkgs+=("$dep")
              fi
            done
          done

          mapfile -t install_pkgs < <(printf '%s\n' "${install_pkgs[@]}" | awk '!seen[$0]++')
          pacman -Sy --noconfirm --needed "${install_pkgs[@]}"

      - name: Validate PKGBUILDs
        shell: bash
        run: |
          set -euo pipefail
          export LANG=C.UTF-8

          for pkgbuild in \
            agent/packaging/PKGBUILD \
            tiers/packaging/PKGBUILD \
            control/packaging/PKGBUILD \
            setup-wizard/packaging/PKGBUILD \
            quickshell-plugin/packaging/PKGBUILD
          do
            pkgdir="$(dirname "$pkgbuild")"
            echo "::group::${pkgbuild}"
            namcap "$pkgbuild"
            su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/$pkgdir' && makepkg --noconfirm --cleanbuild --clean --skipinteg"
            pacman -U --noconfirm "$pkgdir"/*.pkg.tar.zst
            echo "::endgroup::"
          done

      - name: Verify .SRCINFO files are in sync
        shell: bash
        run: |
          set -euo pipefail

          for pkgbuild in \
            agent/packaging/PKGBUILD \
            tiers/packaging/PKGBUILD \
            control/packaging/PKGBUILD \
            setup-wizard/packaging/PKGBUILD \
            quickshell-plugin/packaging/PKGBUILD
          do
            pkgdir="$(dirname "$pkgbuild")"
            expected="$(su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/$pkgdir' && makepkg --printsrcinfo")"
            actual="$(cat "$pkgdir/.SRCINFO")"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error file=$pkgdir/.SRCINFO::.SRCINFO is out of sync with $pkgbuild"
              diff -u <(printf '%s\n' "$actual") <(printf '%s\n' "$expected") || true
              exit 1
            fi
          done

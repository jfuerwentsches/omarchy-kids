[workspace]
resolver = "2"
members = ["common", "agent", "agentd", "wrapper", "override-helper", "pairing"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
libc = "0.2"
omarchy-kids-common = { path = "common" }
